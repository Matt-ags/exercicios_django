{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adicionar Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 700px;">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Cadastrar Novo Médico</h4>
      </div>

      <div class="card-body">
        <form action="/add_medico/" method="POST" class="row g-3">
          {% csrf_token %}

          <div class="col-12">
            <label class="form-label">Nome do Médico</label>
            <input type="text" name="nome" class="form-control" placeholder="Digite o nome" required>
          </div>

          <div class="col-12">
            <label class="form-label">Endereço</label>
            <input type="text" name="endereco" class="form-control" placeholder="Digite o endereço" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Telefone</label>
            <input type="text" name="telefone" class="form-control" placeholder="Digite o telefone" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control" placeholder="Digite o e-mail" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Data de Nascimento</label>
            <input type="date" name="data_nascimento" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">CRM</label>
            <input type="text" name="crm" class="form-control" placeholder="Digite o CRM" required>
          </div>

          <div class="col-12">
            <label class="form-label">Especialidade</label>
            <select name="id_especialidade" class="form-select" required>
              <option value="">Selecione a especialidade</option>
              {% for especialidade in especialidades %}
                <option value="{{ especialidade.id_especialidade }}">{{ especialidade.nome }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-12 d-flex justify-content-end mt-3">
            <a href="/home/" class="btn btn-secondary me-2">Cancelar</a>
            <button type="submit" class="btn btn-success">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
