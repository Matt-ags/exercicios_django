<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuário</title>

    <div class="container mt-5">
        <h1 class="mb-4">Editar Especialidade</h1>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="nome" class="form-label">Nome da Especialidade</label>
                <input type="text" class="form-control" id="nome" name="nome" value="{{ usuario.nome }}" required>
            </div>
            <div class="mb-3">
                <label for="nome" class="form-label">Descrição da Especialidade</label>
                <input type="text" class="form-control" id="descricao" name="descricao" value="{{ usuario.descricao }}" required>
            </div>
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="/home/" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

</body>
</html>
