<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Especialidade</title>
</head>
<body>
        <div class="mb-4">
            <h4>Cadastrar nova especialidade:</h4>
            <form action="/add_especialidade/" method="POST" class="row g-3">
                {% csrf_token %}
                
                <div class="col-md-8">
                    <input type="text" name="nome" class="form-control" placeholder="Nome da Especialidade" required>
                </div>

                <div class="col-md-8">
                    <input type="text" name="descricao" class="form-control" placeholder="Uma breve Descrição" required>
                </div>

                <div class="col-md-4">
                    <button type="submit" class="btn btn-success w-100">Salvar</button>
                </div>
            </form>
        </div>
</body>
</html>
