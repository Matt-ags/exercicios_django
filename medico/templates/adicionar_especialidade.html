<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adicionar Especialidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Cadastrar Nova Especialidade</h4>
      </div>

      <div class="card-body">
        <form action="/add_especialidade/" method="POST" class="row g-3">
          {% csrf_token %}

          <div class="col-12">
            <label class="form-label">Nome da Especialidade</label>
            <input type="text" name="nome" class="form-control" placeholder="Digite o nome da especialidade" required>
          </div>

          <div class="col-12">
            <label class="form-label">Descrição</label>
            <input type="text" name="descricao" class="form-control" placeholder="Uma breve descrição" required>
          </div>

          <div class="col-12 d-flex justify-content-end mt-3">
            <a href="/home/" class="btn btn-secondary me-2">Cancelar</a>
            <button type="submit" class="btn btn-success">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
