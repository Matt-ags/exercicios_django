<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 700px;">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Editar Médico</h4>
      </div>

      <div class="card-body">
        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" name="nome" class="form-control" value="{{ medico.nome }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Endereço</label>
            <input type="text" name="endereco" class="form-control" value="{{ medico.endereco }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" name="telefone" class="form-control" value="{{ medico.telefone }}">
          </div>

          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control" value="{{ medico.email }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Data de Nascimento</label>
            <input type="date" name="data_nascimento" class="form-control" value="{{ medico.data_nascimento|date:'Y-m-d' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">CRM</label>
            <input type="text" name="crm" class="form-control" value="{{ medico.crm }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Especialidade</label>
            <select name="id_especialidade" class="form-select" required>
              {% for esp in especialidades %}
                <option value="{{ esp.id_especialidade }}" {% if esp.id_especialidade == medico.id_especialidade.id_especialidade %}selected{% endif %}>
                  {{ esp.nome }}
                </option>
              {% endfor %}
            </select>
          </div>

          <div class="d-flex justify-content-between mt-4">
            <a href="/home/" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
